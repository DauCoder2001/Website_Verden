<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Billard Club Black &amp; White Verden">
  <defs>
    <radialGradient id="weiss" cx="34%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#f2f4f6"/>
      <stop offset="100%" stop-color="#c3ccd4"/>
    </radialGradient>
    <radialGradient id="schwarz" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#5a5f66"/>
      <stop offset="45%" stop-color="#1b1d21"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- schwarze Acht (hinten) -->
  <circle cx="44" cy="29" r="15" fill="url(#schwarz)"/>
  <circle cx="46" cy="28" r="6.4" fill="#fbfbfb"/>
  <text x="46" y="28.6" fill="#15161a" font-family="Georgia, 'Times New Roman', serif"
        font-size="9" font-weight="700" text-anchor="middle"
        dominant-baseline="central">8</text>
  <ellipse cx="38.5" cy="21" rx="4.6" ry="3" fill="#ffffff" fill-opacity=".3"
           transform="rotate(-28 38.5 21)"/>

  <!-- weiße Kugel (vorne) -->
  <circle cx="20" cy="35" r="15" fill="url(#weiss)" stroke="#b8c2cb" stroke-width="0.8"/>
  <ellipse cx="14.5" cy="27.5" rx="4.8" ry="3.2" fill="#ffffff" fill-opacity=".95"
           transform="rotate(-28 14.5 27.5)"/>
</svg>
